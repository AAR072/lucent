name: Lucent
options:
  bundleIdPrefix: org.lucentcamera
  deploymentTarget:
    iOS: "18.0"
packages:
  LucentCore:
    path: .
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: YES
targets:
  Lucent:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: LucentCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.lucentcamera.Lucent
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "IconSilver IconSpaceGrey IconMonochrom IconPride2022 IconPride2021 IconAperture IconMarkI"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Lucent
        INFOPLIST_KEY_NSCameraUsageDescription: Lucent uses the camera to take photographs.
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: Save photographs you choose to your photo library.
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: Add a location to photographs when Location Tagging is enabled.
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        MARKETING_VERSION: "0.1.1"
        CURRENT_PROJECT_VERSION: "5"
  LucentTests:
    type: bundle.unit-test
    platform: iOS
    sources: [AppTests]
    dependencies:
      - target: Lucent
      - package: LucentCore
  LucentUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: Lucent
schemes:
  Lucent:
    build:
      targets:
        Lucent: all
    test:
      targets: [LucentTests, LucentUITests]
      gatherCoverageData: true
